name: Map UI test (by hand)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright >/dev/null && python -m playwright install --with-deps chromium >/dev/null
      - run: |
          (cd site && python3 -m http.server 8000 >/dev/null 2>&1 &) ; sleep 2
          mkdir -p /tmp/shots && python3 tests/map_ui.py /tmp/shots; echo "exit=$?" > /tmp/shots/exit.txt
      - name: Screenshots to branch ui-shots
        if: always()
        run: |
          cd /tmp/shots && git init -q && git checkout -q -b ui-shots && git add -A && git -c user.name=ci -c user.email=ci@local commit -qm shots
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ui-shots
