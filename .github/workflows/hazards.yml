name: Update hazards
on:
  workflow_dispatch:            # also called every 10 min by cron-job.org (GitHub's own timer does not fire)
    inputs:
      force:
        description: "Rebuild the weather now, even if it is fresh"
        type: boolean
        default: false
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"     # driver reports every 10 min; weather only once an hour (Open-Meteo limit)
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: hazards
  cancel-in-progress: false   # never cancel a running weather build
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Motorway sections (only if missing)
        run: test -f site/roads.json || (cd scripts && python3 build_roads.py)
      - name: Weather on every section (hourly; in between reuse the live file)
        run: |
          LIVE=https://dimana200.github.io/avtoban-alert-bg
          if [ "${{ github.event_name }}" != "push" ] && [ "${{ inputs.force }}" != "true" ] && curl -fsS "$LIVE/hazards.json" -o site/hazards.json \
             && python3 -c "import json,sys,datetime as d; u=json.load(open('site/hazards.json'))['updated']; sys.exit((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(u.replace('Z','+00:00'))).total_seconds()>3300)"; then
            echo "weather is less than 55 minutes old, kept"
            curl -fsS "$LIVE/alerts.json" -o site/alerts.json || true
          else
            # a weather service down must not stop the map: keep the last good file then
            (cd scripts && python3 build_hazards.py) || curl -fsS "$LIVE/hazards.json" -o site/hazards.json
            # "Моят район": NIMH warnings for today and tomorrow by municipality
            (cd scripts && python3 build_alerts.py) || curl -fsS "$LIVE/alerts.json" -o site/alerts.json || true
          fi
      - name: Earthquakes (EMSC, every run)
        run: |
          cd scripts && python3 build_quakes.py || curl -fsS https://dimana200.github.io/avtoban-alert-bg/quakes.json -o ../site/quakes.json || true
      - name: Driver reports (one Firestore query for everybody)
        run: |
          cd scripts && python3 build_reports.py || curl -fsS https://dimana200.github.io/avtoban-alert-bg/reports.json -o ../site/reports.json || echo '{"reports":[]}' > ../site/reports.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
