name: Update hazards
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"     # every 30 minutes
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: hazards
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Motorway sections (only if missing)
        run: test -f site/roads.json || (cd scripts && python3 build_roads.py)
      - name: Weather on every section
        run: cd scripts && python3 build_hazards.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
