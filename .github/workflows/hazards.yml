name: Update hazards
on:
  workflow_dispatch:            # also called every 10 min by cron-job.org (GitHub's own timer does not fire)
    inputs:
      force:
        description: "Rebuild the weather now, even if it is fresh"
        type: boolean
        default: false
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"     # driver reports every 10 min; weather only once an hour (Open-Meteo limit)
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: hazards
  cancel-in-progress: false   # never cancel a running weather build
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Motorway sections (only if missing)
        run: test -f site/roads.json || (cd scripts && python3 build_roads.py)
      - name: Weather on every section (hourly; in between reuse the live file)
        run: |
          LIVE=https://dimana200.github.io/avtoban-alert-bg
          if [ "${{ github.event_name }}" != "push" ] && [ "${{ inputs.force }}" != "true" ] && curl -fsS "$LIVE/hazards.json" -o site/hazards.json \
             && python3 -c "import json,sys,datetime as d; u=json.load(open('site/hazards.json'))['updated']; sys.exit((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(u.replace('Z','+00:00'))).total_seconds()>3300)"; then
            echo "weather is less than 55 minutes old, kept"
            curl -fsS "$LIVE/alerts.json" -o site/alerts.json || true
            curl -fsS "$LIVE/rivers.json" -o site/rivers.json || true
            curl -fsS "$LIVE/air.json" -o site/air.json || true
          else
            # a weather service down must not stop the map: keep the last good file then
            (cd scripts && python3 build_hazards.py) || curl -fsS "$LIVE/hazards.json" -o site/hazards.json
            # "Моят район": NIMH warnings for today and tomorrow by municipality
            (cd scripts && python3 build_alerts.py) || curl -fsS "$LIVE/alerts.json" -o site/alerts.json || true
            # rivers: NIMH measures once a day at 8:00, an hourly look is plenty
            (cd scripts && python3 build_rivers.py) || curl -fsS "$LIVE/rivers.json" -o site/rivers.json || true
            # air quality: a model forecast, every 3 hours is enough (keeps the free Open-Meteo quota)
            if [ $(( $(date -u +%-H) % 3 )) -eq 0 ] || ! curl -fsS "$LIVE/air.json" -o site/air.json; then
              (cd scripts && python3 build_air.py) || curl -fsS "$LIVE/air.json" -o site/air.json || true
            fi
          fi
      - name: Earthquakes (EMSC, every run)
        run: |
          cd scripts && python3 build_quakes.py || curl -fsS https://dimana200.github.io/avtoban-alert-bg/quakes.json -o ../site/quakes.json || true
      - name: Fires seen by satellites (NASA FIRMS, every run)
        run: |
          cd scripts && python3 build_fires.py || curl -fsS https://dimana200.github.io/avtoban-alert-bg/fires.json -o ../site/fires.json || true
      - name: Driver reports (one Firestore query for everybody)
        run: |
          cd scripts && python3 build_reports.py || curl -fsS https://dimana200.github.io/avtoban-alert-bg/reports.json -o ../site/reports.json || echo '{"reports":[]}' > ../site/reports.json
      # Every deploy gives ALL files a new date, so phones would download everything again.
      # Deploy only when something really changed: then phones and browsers get "304 not modified" in between.
      - name: Anything changed since the live site?
        id: diff
        run: |
          cd site
          if [ "${{ github.event_name }}" = "push" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; echo "code pushed"; exit 0; fi
          changed=false
          for f in $(find . -type f | sed 's|^\./||'); do
            if ! curl -sf --max-time 60 --retry 2 -o /tmp/live "https://dimana200.github.io/avtoban-alert-bg/$f"; then echo "new: $f"; changed=true; continue; fi
            cmp -s /tmp/live "$f" && continue
            # fires.json / reports.json carry the time of the run: the same content with a new time is no change
            if { [ "$f" = fires.json ] || [ "$f" = reports.json ]; } && python3 -c "import json,sys; a,b=(json.load(open(x)) for x in sys.argv[1:]); [d.pop('updated',None) for d in (a,b)]; sys.exit(a!=b)" /tmp/live "$f" 2>/dev/null; then
              cp /tmp/live "$f"; continue
            fi
            echo "changed: $f"; changed=true
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      # a change to the page itself: open it in a browser first; a script error stops the deploy (the live site stays as it is)
      - name: The page opens without script errors
        if: github.event_name == 'push' && steps.diff.outputs.changed == 'true'
        run: |
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
          python3 tests/page_smoke.py
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub sometimes cannot find the just-uploaded site for a moment ("No artifacts named github-pages"):
      # wait and try once more instead of failing the whole run
      - id: deploy
        if: steps.diff.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # GitHub's own timer often does not fire, so the monthly jobs (places, roads, map) may never start by themselves.
  # This run comes every 10 minutes from outside: it starts a monthly job whose last success is too old.
  monthly:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          now=$(date +%s)
          for w in avgspeed.yml:32 roads.yml:32 map.yml:35; do
            f=${w%%:*}; days=${w##*:}
            last=$(gh api "repos/$R/actions/workflows/$f/runs?per_page=1" -q '.workflow_runs[0] | (.status + " " + .created_at)' || echo "")
            ok=$(gh api "repos/$R/actions/workflows/$f/runs?status=success&per_page=1" -q '.workflow_runs[0].created_at // "1970-01-01T00:00:00Z"')
            age=$(( (now - $(date -d "$ok" +%s)) / 86400 ))
            lastAge=$(( (now - $(date -d "${last#* }" +%s 2>/dev/null || echo 0)) / 3600 ))
            echo "$f: last success $ok ($age days), latest run: $last"
            # not while one runs, and after a failure wait a day before trying again
            if [ "$age" -ge "$days" ] && [ "${last%% *}" = "completed" ] && [ "$lastAge" -ge 24 ]; then
              echo "starting $f"; gh workflow run "$f" -R "$R" --ref main
            fi
          done

