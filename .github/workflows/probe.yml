name: Probe MVR camera lists (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/probe_mvr.py
      - run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A && git -c user.name=ci -c user.email=ci@local commit -qm out
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
