name: Probe Meteoalarm (temporary)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -m 60 "https://feeds.meteoalarm.org/api/v1/warnings/feeds-bulgaria" -o m.json
          python3 - <<'PY'
          import json
          d=json.load(open('m.json'))
          print('N', len(d['warnings']))
          for w in d['warnings']:
              a=w['alert']; 
              for inf in a['info']:
                  if not inf.get('language','').startswith('bg'): continue
                  p={x['valueName']:x['value'] for x in inf.get('parameter',[])}
                  print('W', a.get('sent'), a.get('msgType'), '|', inf.get('event'), '|', p.get('awareness_level'), p.get('awareness_type'), '|', inf.get('onset'), '->', inf.get('expires'), '|', [x['areaDesc'] for x in inf['area']][:30], '|', (inf.get('description') or '')[:200].replace('\n',' '))
          print('KEYS', list(d['warnings'][0]['alert']['info'][0].keys()))
          PY
