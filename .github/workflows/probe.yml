name: Probe sources
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd scripts && python3 - <<'PY'
          import re, json
          from common import http
          page = http("https://weather.bg/obshtini/index.php?z=d&o=PDV", timeout=60, raw=True).decode("utf-8", "replace")
          # links/params that switch the day
          print("DAYLINKS", sorted(set(re.findall(r'href="([^"]*z=[^"&]*[^"]*)"', page)))[:20])
          print("HEAD", re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", page[page.find("myTable1"):page.find("myTable1")+1500]))[:600])
          for z in ["u", "s", "1", "2", "dd", "t"]:
              try:
                  p = http(f"https://weather.bg/obshtini/index.php?z={z}&o=PDV", timeout=60, raw=True, tries=1).decode("utf-8", "replace")
                  h = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", p[p.find("myTable1"):p.find("myTable1")+700]))
                  print("Z", z, len(p), h[:300])
              except Exception as e:
                  print("Z", z, "ERR", e)
          q = http("https://www.seismicportal.eu/fdsnws/event/1/query?limit=5&format=json&minlat=40&maxlat=45&minlon=21&maxlon=30&minmag=2", timeout=60)
          for f in q.get("features", []):
              p = f["properties"]; print("EQ", p.get("time"), p.get("mag"), p.get("flynn_region"), f["geometry"]["coordinates"])
          PY
