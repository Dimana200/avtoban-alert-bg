name: Probe sizes (temporary)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for f in hazards reports alerts quakes rivers air fires; do
            a=$(curl -s https://dimana200.github.io/avtoban-alert-bg/$f.json | wc -c)
            g=$(curl -s -H 'Accept-Encoding: gzip' https://dimana200.github.io/avtoban-alert-bg/$f.json | wc -c)
            echo "SIZE $f $a $g"
          done
