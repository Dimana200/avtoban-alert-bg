name: Probe sources
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -4 -sL -m 60 -o m.kml "https://www.google.com/maps/d/kml?mid=1brAUuVcYWoBJC5pV6Sp9Ku2mUm6Vrmc&forcekml=1" -w "%{http_code} %{content_type} %{size_download}\n"
          python3 - <<'PY'
          import re, html
          s = open('m.kml', encoding='utf-8', errors='replace').read()
          print(s[:300])
          for f in re.findall(r'<Folder>(.*?)</Folder>', s, re.S):
              name = re.search(r'<name>(.*?)</name>', f, re.S).group(1)
              pms = re.findall(r'<Placemark>(.*?)</Placemark>', f, re.S)
              print('FOLDER', html.unescape(name).strip(), len(pms))
              if 'камер' in name.lower():
                  for p in pms:
                      n = html.unescape(re.sub(r'<!\[CDATA\[|\]\]>', '', re.search(r'<name>(.*?)</name>', p, re.S).group(1))).strip()
                      d = re.search(r'<description>(.*?)</description>', p, re.S)
                      c = re.search(r'<coordinates>\s*(.*?)\s*</coordinates>', p, re.S)
                      print('  CAM', n, '|', c.group(1)[:60] if c else '', '|', html.unescape(re.sub(r'<[^>]+>|<!\[CDATA\[|\]\]>', ' ', d.group(1)))[:150].strip() if d else '')
          PY
