name: Probe sources
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="avtoban-alert-bg/1.0 (https://github.com/Dimana200/avtoban-alert-bg)"
          for u in https://www.api.bg/ https://www.api.bg/index.php/bg/prescentar/novini https://www.bta.bg/bg/news/bulgaria/oficial-messages; do
            echo "=== $u"; curl -4 -sL -A "$UA" -m 40 -o page.html -w "%{http_code} %{url_effective}\n" "$u"
            python3 - <<'PY'
          import re,html
          s=open('page.html',encoding='utf-8',errors='replace').read()
          for href,t in re.findall(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>',s,re.S):
              t=re.sub(r'<[^>]+>|\s+',' ',html.unescape(t)).strip()
              if re.search(r'пътищ|АПИ|обстановк|ограничен|ПТП',t): print(href,'|',t[:120])
          PY
          done
