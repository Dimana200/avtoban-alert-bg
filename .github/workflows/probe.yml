name: Probe cache headers (temporary)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for f in cameras.json hazards.json; do
            echo "== $f $(curl -sI "https://dimana200.github.io/avtoban-alert-bg/$f" | tr -d '\r' | grep -iE '^(etag|last-modified):' | tr '\n' ' ')"
          done
