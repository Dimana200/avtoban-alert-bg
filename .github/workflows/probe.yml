name: Probe sources (temporary)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://hydro.bg/bg/t1.php?ime=&gr=data/&gn=daily" "https://hydro.bg/bg/t1.php?ime=&gr=data/&gn=dajd" "https://info.meteo.bg/openData"; do
          echo "=========== $u"
          curl -sSL -m 40 "$u" -o p.html -w "HTTP %{http_code} %{size_download}B\n"
          python3 - <<'PY'
          import re,html
          s=open('p.html',encoding='utf-8',errors='replace').read()
          print('LINKS', [l for l in sorted(set(re.findall(r'(?:href|src)="([^"]+)"', s, re.I))) if not l.endswith(('.gif','.png'))][:60])
          t=re.sub(r'<script.*?</script>|<style.*?</style>','',s,flags=re.S|re.I)
          t=html.unescape(re.sub(r'<[^>]+>',' | ',t)); t=re.sub(r'(\s*\|\s*)+',' | ',t); t=re.sub(r'\s+',' ',t)
          i=t.find('Оперативна информация за речния отток на'); print('TEXT', t[max(0,i):i+3500] if i>=0 else t[:3500])
          PY
          done
