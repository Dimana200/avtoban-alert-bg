name: Probe sources (temporary)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sI https://info.meteo.bg/openData/river-runoff | sed 's/^/HDR /'
          for u in https://info.meteo.bg/openData/river-runoff/ https://info.meteo.bg/openData/river-runoff/index.php; do
            curl -s -m 40 -c c.txt -b c.txt "$u" -o /dev/null
            curl -s -m 40 -c c.txt -b c.txt -X POST --data "mydate=2026-11-12" -H "Referer: $u" "$u" -o r.html -w "POST $u HTTP %{http_code} %{size_download}B\n"
            grep -oE 'href="[^"]*(csv|CSV)[^"]*"' r.html | head -3 | sed 's/^/CSVLINK /'
          done
          python3 - <<'PY'
          import re,html
          s=open('r.html',encoding='utf-8',errors='replace').read()
          t=re.sub(r'<script.*?</script>|<style.*?</style>','',s,flags=re.S|re.I); t=re.sub(r'</tr>','\n',t)
          t=html.unescape(re.sub(r'<[^>]+>',' | ',t)); t=re.sub(r'(\s*\|\s*)+',' | ',t); t=re.sub(r'[ \t]+',' ',t)
          i=t.find('Свалете CSV'); i=t.find('Свалете CSV', i+20); print('TEXT', t[max(0,i-300):i+4000])
          PY
          l=$(grep -oE 'href="[^"]*\.csv[^"]*"' r.html | head -1 | cut -d'"' -f2); echo "CSV $l"; [ -n "$l" ] && curl -sSL "https://info.meteo.bg/openData/river-runoff/$l" | head -8 | sed 's/^/CSVL /'; curl -sSL "https://info.meteo.bg/$(echo $l | sed 's#^\.\./##')" | head -8 | sed 's/^/CSVL2 /'
