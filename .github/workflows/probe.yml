name: Probe sources
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (avtoban-alert-bg; https://github.com/Dimana200/avtoban-alert-bg)"
          curl -4 -sL -A "$UA" -m 40 -o t.html -w "traffic %{http_code} %{content_type} %{size_download}\n" https://traffic.api.bg/ || echo "curl failed $?"
          touch t.html; head -c 3000 t.html; echo
          for js in $(grep -oE '(src|href)="[^"]+\.(js|json)[^"]*"' t.html | sed -E 's/^(src|href)="//; s/"$//'); do
            case "$js" in http*) u="$js";; /*) u="https://traffic.api.bg$js";; *) u="https://traffic.api.bg/$js";; esac
            echo "=== $u"; curl -4 -sL -A "$UA" -m 40 -o b.js "$u" -w "%{http_code} %{size_download}\n" || true
            grep -oE '"(/[a-zA-Z0-9_./-]*(api|events|incident|restriction|geojson|layers|data)[a-zA-Z0-9_./?=-]*)"|https?://[a-zA-Z0-9.-]+(/[a-zA-Z0-9_./?=-]*)?' b.js | sort -u | head -60
          done
