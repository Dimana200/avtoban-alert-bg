name: Probe sources (temporary)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd scripts && python3 -c "
          import nimh_warn
          for code,d in nimh_warn.fetch_day('d').items():
              if code in ('DOB','SHU'): print(code, sorted(d['munis']))
          "
          cd ..
          curl -sSL -m 40 https://hydro.bg/bg/t1.php -o t1.html
          python3 - <<'PY'
          import re,html
          s=open('t1.html',encoding='utf-8',errors='replace').read()
          print('LINKS', sorted(set(re.findall(r'(?:href|src)="([^"]+)"', s, re.I)))[:80])
          t=re.sub(r'<script.*?</script>|<style.*?</style>','',s,flags=re.S|re.I)
          t=html.unescape(re.sub(r'<[^>]+>',' ',t)); t=re.sub(r'\s+',' ',t)
          print('TEXT', t[:3000])
          PY
          curl -s https://hydro.bg/robots.txt | head -20
