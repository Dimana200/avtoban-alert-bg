name: Probe sources (temporary)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out
          for u in "https://meteo.bg/bg/rekiTablitsa" "https://meteo.bg/bg/forecasts/hydro" "https://meteo.bg/bg/rekiKarta" "https://hydro.bg/bg/t1.php"; do
            f=out/$(echo "$u" | tr -c 'a-zA-Z0-9' _).html
            curl -sSL -m 40 -A "Mozilla/5.0 AvtobanAlertBG" -o $f -w "== $u HTTP %{http_code} %{size_download}B\n" "$u" || true
          done
          curl -s https://meteo.bg/robots.txt > out/robots.txt; cat out/robots.txt | head -40
      - uses: actions/upload-artifact@v4
        with: { name: pages, path: out }
