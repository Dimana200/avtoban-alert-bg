name: Probe sources
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import re, html, urllib.request, urllib.parse, time
          H = {"User-Agent": "Mozilla/5.0 (avtoban-alert-bg; https://github.com/Dimana200/avtoban-alert-bg)"}
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(urllib.parse.quote(u, safe=":/?=&%"), headers=H), timeout=60).read().decode("utf-8", "replace")
          def text(s):
              s = re.sub(r"<script.*?</script>|<style.*?</style>", " ", s, flags=re.S)
              return re.sub(r"[ \t]+", " ", html.unescape(re.sub(r"<(br|/p|/tr|/li|/div|/h\d)[^>]*>", "\n", s, flags=re.I)))
          regions = "blagoevgrad burgas varna veliko-tarnovo vidin vratsa gabrovo dobrich kardzhali kyustendil lovech montana pazardzhik pernik pleven plovdiv razgrad ruse silistra sliven smolyan sofia stara-zagora targovishte haskovo shumen yambol sdvr".split()
          for r in regions:
              base = f"https://www.mvr.bg/{r}/обществен-ред-и-сигурност/мвр-съветва/полезна-информация"
              try:
                  s = get(base)
              except Exception as e:
                  print("REGION", r, "ERR", e); continue
              links = [(urllib.parse.unquote(h), re.sub("<[^>]+>", "", t).strip()) for h, t in re.findall(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>', s, re.S)]
              cam = [l for l in links if re.search(r"(?i)камер|контрол на скоростта|АТСС|скорост", l[1]) and "/" + r + "/" in l[0]]
              print("REGION", r, "links", len(links), "camera pages", cam[:4])
              for h, t in cam[:2]:
                  u = h if h.startswith("http") else "https://www.mvr.bg" + h
                  try:
                      s2 = get(u)
                  except Exception as e:
                      print("  ERR", e); continue
                  tx = text(s2)
                  files = [urllib.parse.unquote(f) for f in re.findall(r'href="([^"]+\.(?:pdf|xlsx?|docx?))"', s2, re.I)]
                  lines = [l.strip() for l in tx.split("\n") if re.search(r"(?i)км|ул\.|бул\.|гр\.|с\.|път", l) and 15 < len(l.strip()) < 300]
                  print("  PAGE", t[:80], "| files", files[:5], "| lines", len(lines))
                  for l in lines[:6]: print("    ", l)
              time.sleep(1)
          PY
