name: Probe sources
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd scripts && python3 - <<'PY'
          import collections
          from build_roads import fetch, AREA
          for q in ['node["highway"="toll_gantry"](area.a);out;', 'node["highway"="milestone"](area.a);out;']:
              e = fetch(AREA + q)
              print('Q', q, len(e))
              print('  tags', collections.Counter(k for x in e for k in x.get('tags', {})).most_common(12))
              for x in e[:8]: print('  ', x['lat'], x['lon'], x.get('tags'))
          PY
