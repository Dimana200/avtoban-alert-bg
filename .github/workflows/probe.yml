name: Probe sources (temporary)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install pillow >/dev/null
          curl -sSL -m 40 https://hydro.bg/bg/t1.php -o t1.html
          curl -sSL -m 60 "https://hydro.bg/bg/river-maps/makeMap1.php?noFile=0" -o m.png
          python3 - <<'PY'
          import re,html
          from PIL import Image
          from collections import Counter
          s=open('t1.html',encoding='utf-8',errors='replace').read()
          i=s.find('Пояснения'); t=html.unescape(re.sub(r'<[^>]+>',' | ',s[i:i+6000])); print('LEGEND', re.sub(r'(\s*\|\s*)+',' | ',t)[:1800])
          print('LEGENDIMG', re.findall(r'<img[^>]+>', s[i:i+6000])[:10])
          im=Image.open('m.png').convert('RGB'); print('SIZE', im.size)
          for m in re.finditer(r'coords="([-\d.]+),([-\d.]+),\d+"\s+id="(\d+)".*?hla\(event,\'\d+\',\'([^\']*)\'', s, re.S):
              x,y=float(m.group(1)),float(m.group(2))
              if not (0<=x<im.size[0] and 0<=y<im.size[1]): continue
              c=Counter(im.getpixel((int(x)+dx,int(y)+dy)) for dx in range(-4,5) for dy in range(-4,5))
              print('ST', m.group(3), m.group(4), int(x), int(y), c.most_common(3))
          PY
