name: Probe datasheet.api.bg (temporary)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (AvtobanAlertBG; road safety app; contact via github.com/Dimana200)"
          echo "=== robots"; curl -sS -m 30 -A "$UA" https://datasheet.api.bg/robots.txt -w "\nHTTP %{http_code}\n" | head -30
          curl -sSL -m 40 -A "$UA" https://datasheet.api.bg/ -o home.html -w "HOME HTTP %{http_code} %{size_download}\n"
          python3 - <<'PY'
          import re,html
          s=open('home.html',encoding='utf-8',errors='replace').read()
          links=sorted(set(re.findall(r'href="([^"#]+)"',s)))
          print('LINKS',links[:80])
          t=html.unescape(re.sub(r'<[^>]+>',' ',re.sub(r'<script.*?</script>|<style.*?</style>','',s,flags=re.S))); t=re.sub(r'\s+',' ',t)
          for k in ('licen','Лиценз','terms','Услови','условия','CC ','Creative'):
              i=t.find(k)
              if i>=0: print('TERMS',k,t[max(0,i-200):i+300])
          PY
          # find the accidents dataset page and its newest file
          for l in $(grep -oE 'href="[^"]*"' home.html | cut -d'"' -f2 | grep -iE 'danger|accident|dataset|data' | sort -u | head -20); do
            u=$l; [[ $u == http* ]] || u="https://datasheet.api.bg${u}"
            echo "--- $u"; curl -sSL -m 40 -A "$UA" "$u" -o d.html -w "HTTP %{http_code} %{size_download}\n"
            grep -oE 'href="[^"]+\.(xml|json|geojson)[^"]*"' d.html | head -5
          done
