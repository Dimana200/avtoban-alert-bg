name: Diag admin levels
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for L in 4 5 6 7 8; do
            Q="[out:json][timeout:120];area[\"ISO3166-1\"=\"BG\"][admin_level=2]->.a;rel[\"boundary\"=\"administrative\"][\"admin_level\"=\"$L\"](area.a);out tags;"
            for i in 1 2 3; do
              curl -4 -sS -m 200 -A "avtoban-alert-bg/1.0" --data-urlencode "data=$Q" https://overpass-api.de/api/interpreter -o l$L.json && python3 -c "import json;d=json.load(open('l$L.json'));e=d['elements'];print('level $L:',len(e),[x['tags'].get('name') for x in e[:6]])" && break
              sleep 30
            done
          done
