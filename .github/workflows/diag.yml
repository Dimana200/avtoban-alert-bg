name: Diag weather.bg
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import re,html,urllib.request,collections,socket
          g=socket.getaddrinfo; socket.getaddrinfo=lambda h,p,f=0,*a,**k: g(h,p,socket.AF_INET,*a,**k)
          UA={"User-Agent":"avtoban-alert-bg/1.0 (https://github.com/Dimana200/avtoban-alert-bg)"}
          get=lambda u: urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=60).read().decode("utf-8","replace")
          colors=collections.Counter()
          for z in ("d","u"):
            for o in ["PDV","VRC","SOF","HKV","BGS","VAR"]:
              s=get(f"https://weather.bg/obshtini/index.php?z={z}&o={o}")
              i=s.find("<div class='obl2'>")
              # region block before the municipal table
              j=s.rfind("<table",0,i); blk=s[max(0,i-6000):i]
              txt=re.sub(r"\s+"," ",html.unescape(re.sub(r"<[^>]+>"," ",blk)))
              print(f"== {z} {o} region text:", txt[-900:])
              print("   region imgs/colors:", re.findall(r"(?:src ?=|background-color:)\s*'?([^'\s>;]+)",blk)[-20:])
              for c in re.findall(r"background-color:(#[0-9a-fA-F]{6})", s[i:]): colors[c]+=1
          print("municipal colors:", colors)
          PY
