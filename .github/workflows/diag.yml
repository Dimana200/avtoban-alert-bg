name: Diag weather.bg
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="avtoban-alert-bg/1.0 (https://github.com/Dimana200/avtoban-alert-bg)"
          curl -4 -sS -A "$UA" "https://weather.bg/obshtini/index.php?z=d" -o pd.html
          curl -4 -sS -A "$UA" "https://weather.bg/obshtini/index.php?z=d&o=PDV" -o pdv.html
          echo "== pdv bytes $(wc -c < pdv.html)"
          python3 - <<'PY'
          import re,html
          for f in ("pd.html","pdv.html"):
              s=open(f,encoding="utf-8",errors="replace").read()
              print("=====",f)
              i=s.find("Асеновград"); print("Асеновград at",i); print(s[max(0,i-1500):i+800] if i>0 else "")
              sc=re.findall(r"<script[^>]*>(.*?)</script>",s,re.S)
              print("scripts:",[len(x) for x in sc]); 
              for x in sc[:3]: print(x[:700])
              rows=re.findall(r"<tr[^>]*>(.*?)</tr>",s,re.S)
              print("rows",len(rows))
              for r in rows[:6]:
                  t=re.sub(r"<[^>]+>"," ",r); print(" |",re.sub(r"\s+"," ",html.unescape(t))[:200], re.findall(r'(?:src|alt|title|class|bgcolor|style)="([^"]{0,60})"',r)[:8])
          PY
