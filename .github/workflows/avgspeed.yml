name: Cameras and average speed sections
on:
  workflow_dispatch:
  push:
    paths: ["data/**", "scripts/build_avgspeed.py", "scripts/build_cameras.py"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: cd scripts && python3 build_avgspeed.py
      - run: cd scripts && python3 build_cameras.py
      - run: |
          git config user.name "avtoban-bot"; git config user.email "avtoban-bot@users.noreply.github.com"
          git add site/avgspeed.json site/cameras.json
          git diff --cached --quiet || (git commit -m "Cameras and average speed sections placed on the map" && git pull --rebase && git push)
