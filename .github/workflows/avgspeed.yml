name: Cameras, average speed sections and places
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 2 * *"      # monthly: a new accident-concentration list (ДАБДП) is published once a year
  push:
    paths: ["data/**", "scripts/build_registries.py", "scripts/verify_places.py", "scripts/build_avgspeed.py", "scripts/build_cameras.py", "scripts/build_munis.py", "scripts/build_ukptp.py", "scripts/build_places.py"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: cd scripts && python3 build_avgspeed.py
        continue-on-error: true            # an outside source down: keep the old file, still build the others
      - run: cd scripts && python3 build_cameras.py
        continue-on-error: true            # an outside source down: keep the old file, still build the others
      - run: cd scripts && python3 build_munis.py
        continue-on-error: true            # an outside source down: keep the old file, still build the others
      - run: cd scripts && python3 build_ukptp.py
        continue-on-error: true            # an outside source down: keep the old file, still build the others
      - run: pip install -q pandas xlrd >/dev/null && cd scripts && python3 build_registries.py
        continue-on-error: true            # the official registers (hospitals, pharmacies): kept from last time if down
      - run: cd scripts && python3 build_places.py
        continue-on-error: true            # an outside source down: keep the old file, still build the others
      - run: |
          git config user.name "avtoban-bot"; git config user.email "avtoban-bot@users.noreply.github.com"
          git add site/avgspeed.json site/cameras.json site/munis.json site/ukptp.json site/places.json data/registries.json
          git diff --cached --quiet || (git commit -m "Cameras and average speed sections placed on the map" && git pull --rebase && git push)
