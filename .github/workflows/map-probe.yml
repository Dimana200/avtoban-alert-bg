name: Map probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm view protomaps-leaflet time --json | tail -6
      - name: Render the map page
        run: |
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
          cd site && (python3 -m http.server 8000 >/dev/null 2>&1 &) && sleep 1 && cd ..
          mkdir -p shots
          cat > r.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  for name, url, view in [("bg", "http://localhost:8000/index.html?app=1", None), ("plovdiv", "http://localhost:8000/index.html?app=1", ([42.1446, 24.7496], 15)), ("sofia13", "http://localhost:8000/index.html?app=1", ([42.6977, 23.3219], 13))]:
                      pg = await b.new_page(viewport={"width": 390, "height": 780}, color_scheme="light")
                      logs = []
                      pg.on("console", lambda m: logs.append(m.type + ": " + m.text))
                      pg.on("pageerror", lambda e: logs.append("ERR " + str(e)))
                      await pg.goto(url); await pg.wait_for_timeout(5000)
                      if view: await pg.evaluate("v => map.setView(v[0], v[1])", list(view)); await pg.wait_for_timeout(6000)
                      info = await pg.evaluate("() => ({pm: !!window.protomapsL, layers: Object.values(map._layers).map(l => l.constructor && (l._url || (l.options && l.options.url) || '')).filter(Boolean)})")
                      print(name, info, logs[:8])
                      await pg.screenshot(path="shots/" + name + ".png")
                  await b.close()
          asyncio.run(main())
          PY
          python r.py
      - uses: actions/upload-artifact@v4
        with: { name: shots, path: shots }
