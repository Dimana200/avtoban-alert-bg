name: Map probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q playwright >/dev/null && playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p out && python3 tests/arrow_probe.py 2>&1 | tee out/arrow.log; cp arrow.png out/ || true
      - if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A && git -c user.name=ci -c user.email=ci@local commit -qm out
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
