name: Map probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm view protomaps-leaflet versions --json | tail -8
          npm view protomaps-leaflet@latest dist-tags main unpkg browser --json
          npm pack protomaps-leaflet@latest >/dev/null && tar tzf protomaps-leaflet-*.tgz | grep dist | head
          curl -sS -o /dev/null -D - -H "Origin: https://dimana200.github.io" -H "Range: bytes=0-15" https://pub-c6b1176858a7454780f1fd9cd784b107.r2.dev/bg.pmtiles | grep -iE "^HTTP|access-control|content-range|content-length"
