name: Map probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q pandas xlrd >/dev/null
          mkdir -p out
          cd scripts && python3 build_registries.py 2>&1 | tee ../out/reg.log
          VERBOSE=1 python3 build_places.py 2>&1 | tee ../out/places.log
          cp ../data/registries.json ../out/
      - if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A && git -c user.name=ci -c user.email=ci@local commit -qm out
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
