name: Map probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
          cat > r.py <<'PY'
          import asyncio, os
          from playwright.async_api import async_playwright
          async def local(route):
              path = route.request.url.split("/avtoban-alert-bg/", 1)[1].split("?")[0] or "index.html"
              f = os.path.join("site", path)
              if os.path.isfile(f): await route.fulfill(path=f)
              else: await route.fulfill(status=404, body="")
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch(); pg = await b.new_page(viewport={"width": 390, "height": 780})
                  await pg.route("https://dimana200.github.io/avtoban-alert-bg/**", local)
                  await pg.goto("https://dimana200.github.io/avtoban-alert-bg/index.html?app=1"); await pg.wait_for_timeout(3000)
                  print("maxZoom", await pg.evaluate("map.getMaxZoom()"))
                  for z in (8, 12, 16, 18):
                      await pg.evaluate("z => map.setView([43.2, 27.9], z)", z); await pg.wait_for_timeout(1500)
                      print("zoom", z, "->", await pg.evaluate("map.getZoom()"))
                  await b.close()
          asyncio.run(main())
          PY
          python r.py
