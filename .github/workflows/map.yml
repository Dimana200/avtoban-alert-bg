name: Map of Bulgaria to Cloudflare R2
# Vector map of Bulgaria (OpenStreetMap, built by Protomaps) as one PMTiles file in the R2 bucket "avtoban-map".
# Runs once a month and by hand.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 5 * *"
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - name: pmtiles CLI
        run: |
          curl -sSL -o p.tgz https://github.com/protomaps/go-pmtiles/releases/download/v1.22.3/go-pmtiles_1.22.3_Linux_x86_64.tar.gz
          tar xzf p.tgz pmtiles
      - name: Extract Bulgaria from the newest Protomaps build (and neighbours around it, zoom 0-14)
        run: |
          key=$(curl -sS https://build-metadata.protomaps.dev/builds.json | python3 -c "import json,sys; print(sorted(x['key'] for x in json.load(sys.stdin))[-1])")
          echo "build: $key"
          ./pmtiles extract "https://build.protomaps.com/$key" bg.pmtiles --bbox=20.0,39.5,31.0,45.5 --maxzoom=14 --download-threads=8
          ./pmtiles show bg.pmtiles | head -20
          ls -l bg.pmtiles
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ACC: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: auto
        run: |
          # the secret may be the bare account id or the whole S3 address: keep only the id
          id=$(printf '%s' "$ACC" | sed -E 's#^https?://##; s#\..*$##; s#/.*$##' | tr -d '[:space:]')
          [ ${#id} -eq 32 ] || { echo "R2_ACCOUNT_ID does not look right (length ${#id})"; exit 1; }
          ep="https://$id.r2.cloudflarestorage.com"
          aws s3 cp bg.pmtiles s3://avtoban-map/bg.pmtiles --endpoint-url "$ep" --content-type application/octet-stream --only-show-errors
          aws s3 ls s3://avtoban-map/ --endpoint-url "$ep"
