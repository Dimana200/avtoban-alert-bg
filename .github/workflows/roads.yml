name: Update motorway sections
on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 1 * *"       # once a month
permissions:
  contents: write
jobs:
  roads:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cd scripts && python3 build_roads.py
      - name: Commit
        run: |
          git config user.name "avtoban-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/roads.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update motorway sections $(date -u +%F)"
          git push
