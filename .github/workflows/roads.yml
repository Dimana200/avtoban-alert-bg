name: Update motorway sections
on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 1 * *"       # once a month
permissions:
  contents: write
jobs:
  roads:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: cd scripts && python3 build_roads.py
        continue-on-error: true
      - name: Speed limits for the phone app
        run: cd scripts && python3 build_speed.py
        continue-on-error: true
      - name: Commit
        run: |
          git config user.name "avtoban-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A site/roads.json $(test -d site/speed && echo site/speed)
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update motorway sections $(date -u +%F)"
          git push
