name: Place ratings
on:
  workflow_dispatch:
  schedule:
    - cron: "4,19,34,49 * * * *"     # every 15 minutes; the hazards run then puts a changed file on the site
permissions:
  contents: write
concurrency: ratings
jobs:
  ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cd scripts && python3 build_ratings.py
      - run: cd scripts && python3 build_fixes.py
        continue-on-error: true            # "Има грешка" reports: a failure here must not stop the ratings
      - run: |
          git config user.name "avtoban-bot"; git config user.email "avtoban-bot@users.noreply.github.com"
          git add state/ratings.json; git add state/fixes.json 2>/dev/null || true
          # the file's "updated" time alone is no change: commit only when the ratings or reports changed
          if ! git diff --cached --quiet; then git add site/ratings.json site/fixes.json; git commit -m "Place ratings and reports"; git pull --rebase && git push; fi
